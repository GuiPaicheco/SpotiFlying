[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spotiflying"
version = "1.0.1"
description = "Sobreposição de letras sincronizadas para Windows"
authors = [{name = "Guilherme Paicheco Ferreira"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.10.2",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.urls]
"GitHub do autor" = "https://github.com/GuiPaicheco"

[project.gui-scripts]
spotiflying = "spotiflying.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotiflying = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
